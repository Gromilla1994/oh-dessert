<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ох, Дезерт! Квест на уценку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120c29; --panel:#1d1640; --line:#fff; --muted:#a99fd8; --pink:#ff5fa2; --yellow:#ffd83a; --navy:#1d2470;
  --pix:'Press Start 2P', monospace; --txt:'Tiny5','Press Start 2P', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:var(--pix);cursor:pointer}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;max-width:560px;margin:0 auto;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font:9px var(--pix);color:var(--muted)}
#hud #wallet{color:var(--yellow)}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;background:#000;
  border-top:4px solid #000;border-bottom:4px solid #000}
#panel{width:100%;flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 10px 12px;min-height:0;overflow:auto}

.box{background:var(--panel);border:4px solid var(--line);box-shadow:0 0 0 4px #000, inset 0 0 0 3px #3a2f78;padding:10px 12px}
#dlg{position:relative;display:flex;gap:10px;min-height:120px;cursor:pointer}
#portrait{width:48px;height:72px;image-rendering:pixelated;flex:none;background:#2b2260;border:3px solid #000}
#who{font:10px var(--pix);margin:2px 0 8px}
#text{font:18px/1.35 var(--txt);white-space:pre-line}
#dlg.narr #text{color:#d9d1ff;font-style:italic}
#next{position:absolute;right:10px;bottom:6px;font:10px var(--pix);color:var(--yellow);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#choices{display:flex;flex-direction:column;gap:8px}
.choice{background:#2b2260;color:#fff;border:3px solid #fff;box-shadow:0 0 0 3px #000;padding:11px 10px;font:16px var(--txt);text-align:left}
.choice:before{content:'▶ ';color:var(--yellow)}
.choice:active{background:var(--pink)}

#hint{font:10px/1.6 var(--pix);color:var(--yellow);text-align:center;min-height:16px}
#pad{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-bottom:4px}
.pbtn{width:84px;height:84px;background:#2b2260;color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px #000,0 6px 0 4px #000;font-size:22px;touch-action:none}
.pbtn:active,.pbtn.on{transform:translateY(4px);box-shadow:0 0 0 4px #000;background:var(--pink)}
#bA{flex:1;height:84px;background:var(--pink);color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px #000,0 6px 0 4px #000;font-size:15px;touch-action:none}
#bA:active{transform:translateY(4px);box-shadow:0 0 0 4px #000;background:#d63f83}
.spacer{flex:1}

#gameui{display:flex;flex-direction:column;gap:8px}
.lbl{font:9px var(--pix);color:var(--muted)}
.tray,.purse{display:flex;flex-wrap:wrap;gap:7px;min-height:52px;padding:8px;background:#2b2260;border:3px solid #fff;box-shadow:0 0 0 3px #000}
.tray{border-style:dashed}
.coin{display:grid;place-items:center;font:9px var(--pix);color:#4a3300;background:#f3c63a;
  border:3px solid #b78a12;box-shadow:inset 3px 3px 0 #fff3b0, 0 3px 0 #000}
.coin.s{width:38px;height:38px;filter:grayscale(.55) brightness(1.15)}
.coin.m{width:44px;height:44px}
.coin.l{width:52px;height:52px}
.paymsg{font:16px/1.3 var(--txt);color:var(--yellow);min-height:22px}
.bigbtn{background:var(--pink);color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px #000,0 6px 0 4px #000;padding:16px 14px;font-size:13px;width:100%}
.bigbtn:active{transform:translateY(4px);box-shadow:0 0 0 4px #000}
.bigbtn.alt{background:#2b2260}

#titleui{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6px}
.logo{font:26px/1.25 var(--pix);text-shadow:4px 4px 0 var(--navy),-2px -2px 0 #000}
.logo span{color:var(--yellow)}
.sub{font:17px/1.4 var(--txt);color:var(--muted)}

.over{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#000}
.ch-num{font:12px var(--pix);color:var(--pink);letter-spacing:2px}
.ch-title{font:22px/1.4 var(--pix);margin:16px 0}
.ch-sub{font:18px var(--txt);color:var(--muted)}
.tap{margin-top:30px;font:9px var(--pix);color:var(--muted);animation:blink 1s steps(2) infinite}

#final{background:rgba(10,6,30,.82);justify-content:flex-start;overflow:auto;padding-top:30px}
.card{background:#fff;color:#1d2470;border:4px solid #000;box-shadow:8px 8px 0 #000;padding:20px 18px;max-width:420px;width:100%;margin:12px 0 22px}
.card h2{font:15px/1.5 var(--pix);margin:0}
.card .age{font:64px var(--pix);color:var(--pink);text-shadow:5px 5px 0 var(--navy);margin:14px 0}
.card p{font:18px/1.4 var(--txt);color:#222;margin:10px 0}
.card .from{color:#666;font-style:italic}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.stats div{background:#efeaff;border:3px solid #000;padding:6px 8px;font:14px var(--txt);color:#444}
.stats b{display:block;font:11px var(--pix);color:var(--navy);margin-bottom:4px}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:var(--yellow);color:#3a2a00;border:4px solid #000;
  font:11px var(--pix);padding:10px 14px;z-index:40;animation:pop 1.8s forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div id="app">
  <div id="hud"><span id="chap">ОХ, ДЕЗЕРТ!</span><span id="clock"></span><span id="wallet"></span></div>
  <canvas id="cv" width="160" height="144"></canvas>
  <div id="panel">
    <div id="titleui">
      <div class="logo">ОХ,<br><span>ДЕЗЕРТ!</span></div>
      <div class="sub">Квест на уценку за 6,90 ₽<br>В ролях: Женя (21), Олег и Захар</div>
      <button class="bigbtn" id="btnPlay">▶ ИГРАТЬ</button>
      <button class="bigbtn alt" id="btnResume" hidden></button>
    </div>
    <div id="dlg" class="box" hidden><canvas id="portrait" width="16" height="24"></canvas>
      <div style="flex:1"><div id="who"></div><div id="text"></div></div><div id="next" hidden>▼</div></div>
    <div id="choices"></div>
    <div id="gameui" hidden></div>
    <div id="hint"></div>
    <div id="pad" hidden>
      <button class="pbtn" id="bL">◀</button>
      <button id="bA">A</button>
      <span class="spacer" id="padSpacer"></span>
      <button class="pbtn" id="bR">▶</button>
    </div>
  </div>
</div>

<div id="chapterCard" class="over" hidden>
  <div class="ch-num" id="chNum"></div>
  <div class="ch-title" id="chTitle"></div>
  <div class="ch-sub" id="chSub"></div>
  <div class="tap">ТАПНИ, ЧТОБЫ ПРОДОЛЖИТЬ</div>
</div>
<div id="final" class="over" hidden></div>

<script>
// ====== Настройки поздравления (можно править) ======
const CONFIG = {
  hero: 'Женя',
  age: 21,
  wish: 'Пусть жизнь будет как Ох Дезерт по уценке: сладкой, неожиданной и почти бесплатной. ' +
        'Пусть рядом всегда будут пацаны, которые готовы ждать завоз пять часов ради тебя. ' +
        'И пусть каждый жёлтый ценник будет твоим!',
  from: 'С любовью, твои друзья',
};

// ====== Telegram ======
const DEV = new URLSearchParams(location.search).has('ch');
const TG = window.Telegram && window.Telegram.WebApp;
try { TG.ready(); TG.expand(); TG.disableVerticalSwipes && TG.disableVerticalSwipes();
      TG.setHeaderColor && TG.setHeaderColor('#120c29'); TG.setBackgroundColor && TG.setBackgroundColor('#120c29'); } catch (e) {}
function haptic(t) {
  try {
    if (!TG || !TG.HapticFeedback) return;
    if (t === 'ok') TG.HapticFeedback.notificationOccurred('success');
    else if (t === 'err') TG.HapticFeedback.notificationOccurred('error');
    else TG.HapticFeedback.impactOccurred(t || 'light');
  } catch (e) {}
}

// ====== Утилиты ======
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sumCoins = arr => arr.reduce((a, b) => a + b, 0);
const rub = k => (k / 100).toFixed(2).replace('.', ',') + ' ₽';
const coinLabel = k => k >= 100 ? (k / 100) + '₽' : k + 'к';
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1900); }

// ====== Холст ======
const W = 160, H = 144, FEET = 126;
const cv = $('#cv'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fit() {
  const avail = innerHeight - 330;
  const w = Math.max(160, Math.min(innerWidth, 560, avail * W / H));
  cv.style.width = w + 'px'; cv.style.height = (w * H / W) + 'px';
}
addEventListener('resize', fit); fit();
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function circ(cx, cy, r, c) { for (let dy = -r; dy <= r; dy++) { const dx = Math.round(Math.sqrt(r * r - dy * dy)); R(cx - dx, cy + dy, dx * 2 + 1, 1, c); } }
function ptext(s, x, y, c, align, size) {
  ctx.font = (size || 8) + 'px "Press Start 2P", monospace'; ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, Math.round(x) + 1, Math.round(y) + 1);
  ctx.fillStyle = c; ctx.fillText(s, Math.round(x), Math.round(y));
}

// ====== Спрайты ======
function spr(rows, pal) { return { rows, pal, w: rows[0].length, h: rows.length }; }
function drawSpr(c, s, x, y, flip, sc) {
  sc = sc || 1; x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < s.h; j++) for (let i = 0; i < s.w; i++) {
    const ch = s.rows[j][i]; if (ch === '.') continue;
    c.fillStyle = s.pal[ch]; c.fillRect(x + (flip ? s.w - 1 - i : i) * sc, y + j * sc, sc, sc);
  }
}
const BOTTLE = spr(['.BBB.', '.BBB.', '.CCC.', 'CCCCC', 'NNNNN', 'NWNWN', 'NNNNN', 'NWWWN', 'YYYYY', 'CCCCC', 'CCCCC', '.CCC.'],
  { B: '#2b38a8', C: '#f7efd6', N: '#1d2470', W: '#fff', Y: '#ffd83a' });
const COIN = spr(['.DDD.', 'DyYYD', 'DyYYD', 'DYYYD', '.DDD.'], { D: '#b78a12', y: '#fff3b0', Y: '#f3c63a' });
const HEART = spr(['.RR.RR.', 'RrRRRRR', 'RRRRRRR', '.RRRRR.', '..RRR..', '...R...'], { R: '#ff3a5a', r: '#ffb0c0' });
const PIGEON = spr(['..GG....', '.GkG....', 'oGPGGG..', '..GGGGGG', '..gGGGg.', '...o.o..'], { G: '#8a90a0', g: '#6a7080', k: '#111', o: '#f08a2a', P: '#5ad0a0' });
const PUDDLE = spr(['...BBBBBBBB...', '.BBbbBBBBbbBB.', '..BBBBBBBBBB..'], { B: '#3a7ad0', b: '#9ad0ff' });
const DOG = spr(['.dd........', 'dDDd......d', 'kDDDDDDDDd.', 'DDDDDDDDDD.', '.pDDDDDDDD.', '..DDDDDDDD.', '..D.D..D.D.', '..d.d..d.d.'], { D: '#c07a3a', d: '#7a4a1a', k: '#111', p: '#ff7aa0' });
const FISH = spr(['.SSSSS.S.', 'SkSSSSSSS', 'SSSSSSSSS', '.SSSSS.S.'], { S: '#7a9ab8', k: '#111' });
const KEFIR = spr(['..GG..', '.GGGG.', 'WWWWWW', 'WGGGGW', 'WWWWWW', 'WkkkWW', 'WWWWWW', 'WWWWWW'], { G: '#3a9a4a', W: '#f4f4f4', k: '#999' });
const ONION = spr(['..G...', '..GG..', '.PPPP.', 'PpPPPP', 'PpPPPP', 'PPPPPP', '.PPPP.'], { G: '#5ab05a', P: '#b05ab0', p: '#e0a0e0' });
const CAN = spr(['SSSSS', 'RRRRR', 'RWWWR', 'RRRRR', 'RWWWR', 'RRRRR', 'SSSSS'], { S: '#ccc', R: '#d23a3a', W: '#fff' });
const BAG = spr(['.WW......WW.', '.W.W....W.W.', '.W..W..W..W.', '.WWWWWWWWWW.', 'WWWWWWWWWWWW', 'WWWWWWWWWWWW', 'WWWRRWWRRWWW',
  'WWWWWWWWWWWW', 'WWWRWWWWRWWW', 'WWWWRRRRWWWW', 'wWWWWWWWWWWw', '.wwwwwwwwww.'], { W: '#f4f4f4', w: '#cfcfd8', R: '#ff5fa2' });
const BRAIN = spr(['..PPPPP...', '.PpPPpPP..', 'PPPpPPPpP.', 'PpPPPpPPP.', 'PPPpPPPpPP', '.PPPPpPPP.', '..PPPPPP..', '....PP....'], { P: '#ff8ac0', p: '#c0508a' });
const TERM = spr(['GGGGGGGG', 'GKKKKKKG', 'GKggggKG', 'GKggggKG', 'GKKKKKKG', 'GGGGGGGG', '..GGGG..', '..GGGG..', '..GGGG..', '.GGGGGG.'], { G: '#9aa0aa', K: '#222', g: '#3bd18a' });
const PHONE = spr(['KKKKKKK', 'KSSSSSK', 'KSGGGSK', 'KSGWGSK', 'KSGGGSK', 'KSSSSSK', 'KSSSSSK', 'KSSSSSK', 'KKKKKKK', 'KKKWKKK', 'KKKKKKK'], { K: '#222', S: '#5ad1ff', G: '#3bd18a', W: '#fff' });

// ====== Персонажи ======
const CH = {
  'Женя':      { skin: '#f2c39b', hair: '#5a3a22', shirt: '#ff5fa2', pants: '#2b3a8a', shoes: '#222', hat: 'party' },
  'Олег':      { skin: '#f0bf96', hair: '#1e1e1e', shirt: '#3a8ee8', pants: '#333', shoes: '#eee', glasses: true },
  'Захар':     { skin: '#e9b48a', hair: '#7a4a2a', shirt: '#4cc06a', pants: '#4a3a2a', shoes: '#222', hat: 'cowboy' },
  'Галя':      { skin: '#f3c9a5', hair: '#e2512a', shirt: '#2a6ad0', pants: '#333', shoes: '#222', long: true, apron: true },
  'Баба Зина': { skin: '#efc3a0', hair: '#aaa', shirt: '#7a3aa0', pants: '#5a2a7a', shoes: '#333', hat: 'scarf', scarf: '#d23a3a', skirt: true },
  'Охранник':  { skin: '#e8b890', hair: '#222', shirt: '#2a3040', pants: '#1a1e26', shoes: '#000', hat: 'cap' },
  'Самокатчик':{ skin: '#f0c0a0', hair: '#333', shirt: '#ffb020', pants: '#333', shoes: '#222', hat: 'helmet' },
};
const COLORS = { 'Женя': '#ff5fa2', 'Олег': '#5ad1ff', 'Захар': '#7cf08a', 'Галя': '#ff8a5c', 'Баба Зина': '#d8a0ff', 'Охранник': '#c8c8ff',
  'Голубь': '#cfd4e0', 'Касса': '#3bd18a', 'Голос в голове': '#ff8ac0', 'Все': '#ffd83a' };

function drawChar(c, cfg, x, y, frame, flip) {
  x = Math.round(x); y = Math.round(y);
  const P = (sx, sy, w, h, col) => { c.fillStyle = col; c.fillRect(flip ? x + 12 - sx - w : x + sx, y + sy, w, h); };
  if (cfg.skirt) {
    P(3, 16, 2, 1, cfg.skin); P(7, 16, 2, 1, cfg.skin);
    P(3, 17, 3, 1, cfg.shoes); P(7, 17, 3, 1, cfg.shoes);
  } else {
    const L = frame % 2 === 0 ? [3, 7] : [4, 6];
    P(L[0], 14, 2, 3, cfg.pants); P(L[1], 14, 2, 3, cfg.pants);
    P(L[0], 17, 3, 1, cfg.shoes); P(L[1], 17, 3, 1, cfg.shoes);
  }
  const sw = frame % 2 === 0 ? 0 : 1;
  P(2, 8, 8, 6, cfg.shirt); P(2, 8, 1, 6, 'rgba(0,0,0,.18)');
  P(1, 8 + sw, 1, 4, cfg.shirt); P(10, 8 + (1 - sw), 1, 4, cfg.shirt);
  P(1, 12 + sw, 1, 1, cfg.skin); P(10, 12 + (1 - sw), 1, 1, cfg.skin);
  if (cfg.skirt) P(2, 13, 8, 3, cfg.pants);
  if (cfg.apron) { P(4, 9, 4, 6, '#f4f4f4'); P(4, 9, 4, 1, '#ddd'); }
  if (cfg.hat === 'scarf') {
    P(2, 1, 8, 8, cfg.scarf); P(3, 2, 1, 1, '#ffd0d0'); P(8, 6, 1, 1, '#ffd0d0'); P(3, 6, 1, 1, '#ffd0d0');
    P(4, 3, 5, 5, cfg.skin); P(4, 3, 5, 1, cfg.hair);
    P(5, 8, 3, 2, cfg.scarf);
  } else {
    if (cfg.long) { P(2, 1, 8, 3, cfg.hair); P(2, 3, 2, 7, cfg.hair); }
    P(3, 2, 6, 6, cfg.skin);
    if (!cfg.long) { P(3, 1, 6, 2, cfg.hair); P(3, 3, 1, 2, cfg.hair); }
  }
  P(5, 4, 1, 1, '#111'); P(7, 4, 1, 1, '#111');
  P(6, 6, 2, 1, '#b8705a');
  if (cfg.glasses) { P(4, 4, 5, 1, '#111'); P(4, 4, 2, 2, '#111'); P(7, 4, 2, 2, '#111'); P(5, 4, 1, 1, '#555'); }
  if (cfg.hat === 'party') {
    P(5, -4, 1, 1, '#ffd83a'); P(5, -3, 2, 1, '#ff5fa2'); P(4, -2, 3, 1, '#5ad1ff'); P(4, -1, 4, 1, '#ff5fa2'); P(3, 0, 5, 1, '#ffd83a'); P(3, 1, 6, 1, '#5ad1ff');
  } else if (cfg.hat === 'cowboy') {
    P(4, -1, 4, 2, '#9a6a3a'); P(4, 0, 4, 1, '#4a2a10'); P(1, 1, 10, 1, '#9a6a3a'); P(3, 2, 6, 1, '#7a4a22');
  } else if (cfg.hat === 'cap') {
    P(3, 0, 6, 2, '#1c2440'); P(8, 2, 3, 1, '#111'); P(5, 0, 1, 1, '#ffd83a');
  } else if (cfg.hat === 'helmet') {
    P(3, 0, 6, 3, '#ff7a1c'); P(4, 0, 4, 1, '#ffb070');
  }
}
function drawPortrait(name) {
  const p = $('#portrait'), c = p.getContext('2d');
  c.clearRect(0, 0, 16, 24); c.imageSmoothingEnabled = false;
  if (CH[name]) drawChar(c, CH[name], 2, 5, 0, false);
  else if (name === 'Все') drawChar(c, CH['Женя'], 2, 5, 0, false);
  else if (name === 'Голубь') drawSpr(c, PIGEON, 4, 10, true);
  else if (name === 'Голос в голове') drawSpr(c, BRAIN, 3, 8);
  else if (name === 'Касса') drawSpr(c, TERM, 4, 7);
  p.hidden = !(CH[name] || ['Все', 'Голубь', 'Голос в голове', 'Касса'].includes(name));
}

// ====== Локации ======
const TREE = (x, cam, top) => {
  R(x - cam + 4, top + 14, 3, 112 - top - 14, '#6a4a2a');
  circ(x - cam + 5, top + 8, 8, '#e0701a'); circ(x - cam + 1, top + 12, 5, '#f09a2a'); circ(x - cam + 10, top + 11, 5, '#ffc23a');
};
const leaves = (w, cam, y0) => { for (let i = 0; i < w; i += 13) R(i - cam, y0 + (i * 7) % 12, 2, 1, i % 3 ? '#f08a2a' : '#ffc23a'); };
const SKY = {
  day: ['#6ec0ff', '#8ccfff', '#a8dcff'],
  sunset: ['#5a3a8a', '#c05a8a', '#f08a6b', '#ffb46b'],
  night: ['#0b0a24', '#141238', '#1e1a4a'],
};
function sky(cam, kind, h) {
  const b = SKY[kind]; const bh = Math.ceil(h / b.length);
  b.forEach((c, i) => R(0, i * bh, W, bh, c));
  if (kind === 'night') for (let i = 0; i < 30; i++) R((i * 53 + 7) % W, (i * 31) % (h - 10), 1, 1, '#fff');
  if (kind === 'sunset') circ(30 - cam * 0.2, h - 6, 10, '#ffe08a');
}
function shopFront(x, cam, lit) {
  R(x - cam, 64, 88, 48, '#a8e0b0'); R(x - cam, 64, 88, 2, '#7ab88a');
  R(x - cam + 4, 68, 80, 13, '#1d2470'); ptext('ПРОДУКТЫ', x - cam + 44, 71, '#ffd83a', 'center');
  R(x - cam + 52, 86, 22, 26, '#555'); R(x - cam + 54, 88, 18, 24, lit ? '#ffe9a0' : '#8fd3ff'); R(x - cam + 62, 88, 1, 24, '#555');
  R(x - cam + 6, 88, 38, 18, '#555'); R(x - cam + 8, 90, 34, 14, lit ? '#ffe9a0' : '#bfe8ff');
  drawSpr(ctx, BOTTLE, x - cam + 12, 91); drawSpr(ctx, BOTTLE, x - cam + 20, 91); R(x - cam + 30, 94, 8, 6, '#ffd83a');
}
const ROOMS = {

// ====== Мир ======
const world = { room: ROOMS.home, opts: {}, cam: 0, actors: [], party: [], control: false, target: null, speaker: null, phone: false };
const input = { L: false, R: false, onA: null };
function addActor(n, x, face) { const a = { n, x, face, dist: 0, moving: false, tx: null, cb: null }; world.actors.push(a); return a; }
const actor = n => world.actors.find(a => a.n === n);
function setRoom(id, o) {
  o = o || {};
  world.room = ROOMS[id]; world.opts = o; world.actors = []; world.target = null; world.control = false; world.phone = false;
  const px = o.x != null ? o.x : 16;
  addActor('Женя', px, o.face || 1);
  world.party = (o.party || []).slice();
  world.party.forEach((n, i) => addActor(n, px - (o.face || 1) * 13 * (i + 1), o.face || 1));
  (o.npc || []).forEach(a => addActor(a[0], a[1], a[2] || -1));
  world.cam = clamp(px + 6 - W / 2, 0, world.room.w - W);
  if (o.clock) $('#clock').textContent = '🕒 ' + o.clock;
  mode = WORLD;
}
function moveActor(n, x) { return new Promise(res => { const a = actor(n); a.tx = x; a.cb = res; }); }
function walk(x, hint) {
  return new Promise(res => {
    world.target = { x, res }; world.control = true;
    showPanel('pad'); setPad({ L: true, R: true }); $('#hint').textContent = hint || '';
  });
}
const WORLD = {
  update(dt) {
    const p = actor('Женя');
    for (const a of world.actors) a.moving = false;
    if (world.control) {
      const dir = (input.R ? 1 : 0) - (input.L ? 1 : 0);
      if (dir) { const nx = clamp(p.x + dir * 44 * dt, 2, world.room.w - 14); p.dist += Math.abs(nx - p.x); p.x = nx; p.face = dir; p.moving = true; }
      if (world.target && Math.abs(p.x - world.target.x) <= 5) {
        const t = world.target; world.target = null; world.control = false; input.L = input.R = false;
        document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('on'));
        $('#hint').textContent = ''; showPanel('none'); t.res();
      }
    }
    for (const a of world.actors) if (a.tx != null) {
      const d = a.tx - a.x, s = Math.sign(d) * Math.min(Math.abs(d), 40 * dt);
      a.x += s; a.dist += Math.abs(s); a.face = Math.sign(d) || a.face; a.moving = true;
      if (Math.abs(a.tx - a.x) < .5) { a.x = a.tx; a.tx = null; a.moving = false; const cb = a.cb; a.cb = null; cb && cb(); }
    }
    world.party.forEach((n, i) => {
      const f = actor(n); if (!f || f.tx != null) return;
      const want = p.x - p.face * 13 * (i + 1), d = want - f.x;
      if (Math.abs(d) > 3) { const s = Math.sign(d) * Math.min(Math.abs(d), 48 * dt); f.x += s; f.dist += Math.abs(s); f.face = Math.sign(d); f.moving = true; }
      else if (!p.moving) f.face = p.face;
    });
    const tc = clamp(p.x + 6 - W / 2, 0, world.room.w - W);
    world.cam += (tc - world.cam) * Math.min(1, dt * 6);
  },
  draw(time) {
    const cam = Math.round(world.cam);
    world.room.draw(cam, world.opts);
    const order = world.actors.slice().sort((a, b) => (a.n === 'Женя') - (b.n === 'Женя'));
    for (const a of order) {
      const isSpeaker = world.speaker === a.n || (world.speaker === 'Все' && ['Женя', 'Олег', 'Захар'].includes(a.n));
      if (a.n === 'Голубь') {
        drawSpr(ctx, PIGEON, a.x - cam, FEET - 6, a.face > 0);
      } else {
        const fr = a.moving ? Math.floor(a.dist / 4) % 2 : 0;
        drawChar(ctx, CH[a.n], a.x - cam, FEET - 18, fr, a.face < 0);
        if (a.n === 'Женя' && world.phone) R(a.x - cam + (a.face < 0 ? 0 : 9), FEET - 15, 2, 4, '#222');
      }
      if (isSpeaker) {
        const bx = a.x - cam + 2, by = (a.n === 'Голубь' ? FEET - 16 : FEET - 30) + (Math.floor(time * 3) % 2);
        R(bx, by, 9, 6, '#fff'); R(bx + 3, by + 6, 2, 2, '#fff'); R(bx + 2, by + 2, 1, 1, '#000'); R(bx + 4, by + 2, 1, 1, '#000'); R(bx + 6, by + 2, 1, 1, '#000');
      }
    }
    if (world.target && world.control) {
      const tx = world.target.x + 6 - cam, by = 84 + Math.round(Math.sin(time * 6) * 2);
      if (tx >= -4 && tx <= W + 4) { R(tx - 3, by, 7, 2, '#ffd83a'); R(tx - 2, by + 2, 5, 2, '#ffd83a'); R(tx - 1, by + 4, 3, 2, '#ffd83a'); R(tx, by + 6, 1, 1, '#ffd83a'); }
      else if (Math.floor(time * 3) % 2) ptext(tx > W ? '>' : '<', tx > W ? W - 10 : 2, 60, '#ffd83a');
    }
  },
};

function holdBtn(el, key) {
  const on = e => { e.preventDefault(); input[key] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} haptic('light'); };
  const off = () => { input[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
}
holdBtn($('#bL'), 'L'); holdBtn($('#bR'), 'R');
$('#bA').addEventListener('pointerdown', e => { e.preventDefault(); input.onA && input.onA(); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') input.L = true;
  if (e.key === 'ArrowRight') input.R = true;
  if (e.repeat) return;
  if ([' ', 'Enter', 'ArrowUp', 'z', 'x'].includes(e.key)) { e.preventDefault(); if (advanceFn) advanceFn(); else if (input.onA) input.onA(); }
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft') input.L = false; if (e.key === 'ArrowRight') input.R = false; });
let touchKey = null;
const local = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = local(e);
  if (advanceFn) { advanceFn(); return; }
  if (mode && mode.pointer) { mode.pointer('down', p.x, p.y); return; }
  if (mode === WORLD && world.control) { touchKey = p.x < W / 2 ? 'L' : 'R'; input[touchKey] = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener('pointermove', e => { if (mode && mode.pointer) { const p = local(e); mode.pointer('move', p.x, p.y, e.buttons); } });
const cvUp = () => { if (touchKey) { input[touchKey] = false; touchKey = null; } };
cv.addEventListener('pointerup', cvUp); cv.addEventListener('pointercancel', cvUp);

// ====== Главный цикл ======
let lastT = performance.now(), clockT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; clockT += dt;
  if (mode) { mode.update && mode.update(dt); ctx.clearRect(0, 0, W, H); mode.draw(clockT); }

}

function makeWake() {
  const NEED = 35, TIME = 10;

    reset() { m.count = 0; m.started = 0; m.left = TIME; m.shake = 0; m.pointer = (t) => { if (t === 'down') m.onA(); }; },
    onA() {
      if (!m.active) return;

      if (m.count >= NEED) m.finish(true);
    },
    update(dt) {
      m.shake = Math.max(0, m.shake - dt);

    },
    draw(t) {

      R(46, 90, 60, 8, '#4a7ad0'); R(46, 90, 60, 1, '#7aa0e8');

}

// --- 5. Касса: ровно 6,90
function canPay(coins, target) {
  const dp = new Array(target + 1).fill(false); dp[0] = true;
  for (const c of coins) for (let s = target; s >= c; s--) if (dp[s - c]) dp[s] = true;
  return dp[target];
}
async function gamePay() {
  const PRICE = 690;
  let tray = [];
  mode = {
    draw() {
      R(0, 0, W, H, '#e8eef8'); R(0, 0, W, 8, '#2a6ad0');
      R(30, 14, 100, 96, '#8a909a'); R(36, 20, 88, 52, '#111'); R(38, 22, 84, 48, '#0b2a22');
      ptext('К ОПЛАТЕ:', 42, 26, '#7dffb9', 'left', 6); ptext('6,90', 118, 36, '#7dffb9', 'right', 8);
      ptext('ВНЕСЕНО:', 42, 50, '#7dffb9', 'left', 6); ptext(rub(sumCoins(tray.map(c => c.v))).replace(' ₽', ''), 118, 58, '#ffd83a', 'right', 8);
      R(56, 80, 48, 6, '#333'); R(60, 82, 40, 2, '#111');
      drawSpr(ctx, BOTTLE, 136, 98); R(140, 106, 3, 2, '#ffd83a');
      for (let y = 110; y < H; y += 8) for (let x = 0; x < W; x += 8) R(x, y, 8, 8, (x / 8 + y / 8) % 2 ? '#cfd6e6' : '#bcc4d8');
      drawChar(ctx, CH['Женя'], 6, FEET - 18, 0, false);
    },
  };
  await say('Касса', 'К оплате: 6,90 ₽. Сдача не выдаётся. Тапай по монеткам, чтобы положить их в лоток. Нужно ровно 6 рублей 90 копеек.');
  await new Promise(resolve => {
    const purse = state.coins.map((v, i) => ({ v, id: i })).sort((a, b) => b.v - a.v);
    const ui = $('#gameui');
    ui.innerHTML = `<div class="lbl">ЛОТОК (ТАПНИ, ЧТОБЫ ЗАБРАТЬ):</div><div class="tray"></div>
      <div class="lbl">МЕЛОЧЬ В КАРМАНЕ:</div><div class="purse"></div>
      <div class="paymsg"></div><button class="bigbtn">ОПЛАТИТЬ</button>`;
    showPanel('ui');
    const trayEl = ui.querySelector('.tray'), purseEl = ui.querySelector('.purse'), msg = ui.querySelector('.paymsg');
    const coinEl = c => `<div class="coin ${c.v <= 50 ? 's' : c.v < 500 ? 'm' : 'l'}" data-id="${c.id}">${coinLabel(c.v)}</div>`;
    function render() { trayEl.innerHTML = tray.map(coinEl).join(''); purseEl.innerHTML = purse.filter(c => !tray.includes(c)).map(coinEl).join(''); }
    purseEl.onclick = e => { const el = e.target.closest('.coin'); if (!el) return; tray.push(purse.find(c => c.id === +el.dataset.id)); haptic('light'); render(); };
    trayEl.onclick = e => { const el = e.target.closest('.coin'); if (!el) return; tray = tray.filter(c => c.id !== +el.dataset.id); haptic('light'); render(); };
    ui.querySelector('.bigbtn').onclick = () => {
      const s = sumCoins(tray.map(c => c.v));
      if (s === PRICE) {
        haptic('ok');
        const used = new Set(tray.map(c => c.id));
        state.coins = state.coins.filter((_, i) => !used.has(i)); updateWallet();
        ui.innerHTML = ''; showPanel('none'); resolve();
      } else {
        haptic('err'); state.tries++;
        msg.textContent = s > PRICE ? 'Касса: «Сдача не выдаётся». Галя из зала: «БЕЗ СДАЧИ, Я СКАЗАЛА!»'
          : s === 0 ? 'Захар: «Женя, монетки надо положить, братан.»' : `Не хватает ${rub(PRICE - s)}. Олег: «Ещё чуть-чуть, именинник!»`;
      }
    };
    render();
  });
}

// ====== Финал: салют ======
function showFinal() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  const sparks = [];
  mode = {
    update(dt) {
      WORLD.update(dt);
      if (Math.random() < dt * 2.2) {
        const x = 20 + Math.random() * 120, y = 15 + Math.random() * 40, col = ['#ffd83a', '#ff5fa2', '#5ad1ff', '#7cf08a', '#fff'][rnd(5)];
        for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, v = 20 + Math.random() * 20; sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1.2, col }); }
      }
      sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 20 * dt; s.l -= dt; });
      for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].l <= 0) sparks.splice(i, 1);
    },
    draw(t) { WORLD.draw(t); sparks.forEach(s => R(s.x, s.y, 1, 1, s.col)); },
  };
  showPanel('none'); $('#hint').textContent = 'С ДНЮХОЙ, ЖЕНЯ!';
  const ms = Date.now() - state.start, mm = Math.floor(ms / 60000), ss = Math.floor(ms / 1000) % 60;
  const el = $('#final');
  setTimeout(() => {
    el.innerHTML = `<div class="card">
        <h2>С ДНЁМ РОЖДЕНИЯ, ${CONFIG.hero.toUpperCase()}!</h2>
        <div class="age">${CONFIG.age}</div>
        <p>${CONFIG.wish}</p>
        <p class="from">${CONFIG.from} 🥳</p>
        <div class="stats">
          <div><b>${mm}:${String(ss).padStart(2, '0')}</b>время</div>
          <div><b>6,90₽</b>потрачено</div>
          <div><b>${state.tries}</b>фейлов</div>
        </div>
      </div>
      <button class="bigbtn" id="seeSalute" style="max-width:420px">🎆 СМОТРЕТЬ САЛЮТ</button>
      <button class="bigbtn alt" id="again" style="max-width:420px;margin-top:14px">↻ ПРОЙТИ ЕЩЁ РАЗ</button>`;
    el.hidden = false; haptic('ok');
    $('#seeSalute').onclick = () => { el.hidden = true; setTimeout(() => { el.hidden = false; }, 9000); };
    $('#again').onclick = () => { el.hidden = true; $('#hint').textContent = ''; startGame(0, freshState()); };
  }, 2500);
}

// ====== Титульный экран ======
const TITLE = {
  s: 0,
  update(dt) { TITLE.s += 40 * dt; },
  draw(time) {
    const s = TITLE.s;
    sky(0, 'sunset', 112);
    for (let k = -1; k < 4; k++) {
      const bx = k * 60 - (s * .3 % 60), idx = k + Math.floor(s * .3 / 60);
      R(bx, 60, 52, 52, '#3a2a6a');
      for (let wy = 66; wy < 104; wy += 10) for (let wx = 5; wx < 46; wx += 10) R(bx + wx, wy, 5, 6, (wx + wy + idx * 7) % 3 ? '#2a1d5a' : '#ffe58a');
    }
    R(0, 112, W, 32, '#55556a'); for (let x = -(s % 16); x < W; x += 16) R(x, 112, 1, 18, '#4a4a5e');
    const fr = Math.floor(time * 8) % 2;
    drawChar(ctx, CH['Захар'], 40, FEET - 18, fr, false);
    drawChar(ctx, CH['Олег'], 56, FEET - 18, 1 - fr, false);
    drawChar(ctx, CH['Женя'], 74, FEET - 18, fr, false);
    const bob = Math.round(Math.sin(time * 2) * 3);
    drawSpr(ctx, BOTTLE, 114, 10 + bob, false, 4);
    R(128, 48 + bob, 18, 9, '#ffd83a'); ptext('-95%', 137, 50 + bob, '#c00', 'center', 5);
    ptext('OH!', 8, 12, '#fff', 'left', 16); ptext('DESSERT', 8, 34, '#ffd83a', 'left', 10);
    ptext('КВЕСТ НА УЦЕНКУ', 8, 52, '#fff', 'left', 6);
  },
};

// ====== Запуск ======
async function startGame(from, st) {
  state = st; updateWallet();
  showPanel('none');
  for (let i = from; i < CHAPTERS.length; i++) {
    state.ch = i; save();
    await CHAPTERS[i]();
  }
}
(async function init() {
  mode = TITLE; showPanel('title');
  requestAnimationFrame(loop);
  try { await Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('18px Tiny5')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  const dev = new URLSearchParams(location.search).get('ch');
  if (dev) { const s = freshState(); s.coins = [500, 100, 50, 50, 10, 10, 10, 10, 200]; startGame(+dev - 1, s); return; }
  const saved = load();
  if (saved && saved.ch > 0 && saved.ch < CHAPTERS.length) {
    const b = $('#btnResume'); b.hidden = false; b.textContent = '▶ ПРОДОЛЖИТЬ (ГЛ.' + (saved.ch + 1) + ')';
    b.onclick = () => { haptic('light'); startGame(saved.ch, saved); };
    $('#btnPlay').textContent = '↻ НАЧАТЬ ЗАНОВО';
  }
  $('#btnPlay').onclick = () => { haptic('medium'); startGame(0, freshState()); };
})();
